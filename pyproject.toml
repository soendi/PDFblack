[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfblack"
version = "1.2.1"
description = "Automatische Schwaerzung personenbezogener Daten in PDF-Dateien"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PDFblack" }]
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24",
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.gui-scripts]
pdfblack = "pdfblack.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
