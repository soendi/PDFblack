name: Installer bauen und ans Release hängen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v (z. B. 1.0.6): Installer bauen, danach Tag und Release anlegen. Leer = nur bauen."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (Setup-EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten und deutsches Sprachmodell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          python -m spacy download de_core_news_md

      - name: Tests
        run: python -m pytest tests -q

      - name: Installer bauen und selbst testen
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1

      - name: Installer als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: PDFblack-Setup
          path: dist/*Setup.exe
          retention-days: 7
          if-no-files-found: error

  release:
    name: Tag und Release (nach dem Installer)
    needs: [windows]
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fertigen Installer holen
        uses: actions/download-artifact@v4
        with:
          name: PDFblack-Setup
          path: dist

      - name: Tag und Release anlegen, Installer anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then TAG="v${INPUT_VERSION}"; else TAG="${TAG_REF}"; fi
          echo "Tag: ${TAG}"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "PDFblack ${TAG#v}" \
              --target "${HEAD_SHA}" \
              --notes-file docs/release-notes.md
          fi
          gh release upload "${TAG}" dist/*Setup.exe --clobber
          gh release edit "${TAG}" --notes-file docs/release-notes.md
