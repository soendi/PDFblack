name: Installer bauen und ans Release hängen

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, an das die Installer gehängt werden"
        required: true
        default: "v1.0.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (Setup-EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Abhängigkeiten und deutsches Sprachmodell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          python -m spacy download de_core_news_md

      - name: Tests
        run: python -m pytest tests -q

      - name: Installer bauen und selbst testen
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1

      - name: An das Release anhängen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $setup = Get-ChildItem dist/*Setup.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw "Kein Setup-EXE gefunden" }
          gh release upload $env:TAG $setup --clobber

  notes:
    name: Release-Notizen aktualisieren
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notizen aus dem Repository setzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --notes-file docs/release-notes.md
